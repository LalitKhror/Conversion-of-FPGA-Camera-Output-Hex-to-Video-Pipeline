<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FPGA HEX to Video Pipeline Architecture</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: #0d1117;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
</style>

</head>

<body>

<div align="center">

<!-- ================= ORIGINAL SVG (UNCHANGED) ================= -->

<svg width="100%" height="560" viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg">

<style>
:root {
  --bg: #0d1117;
  --box: #161b22;
  --stroke: #58a6ff;
  --text: #c9d1d9;
  --accent: #3fb950;
}

.background { fill: var(--bg); }

.box {
  fill: var(--box);
  stroke: var(--stroke);
  stroke-width: 1.5;
  rx: 12;
  transition: all 0.25s ease;
  cursor: pointer;
}

.group:hover .box {
  stroke: var(--accent);
  filter: drop-shadow(0 0 6px var(--accent));
}

.text {
  fill: var(--text);
  font-family: Arial;
  font-size: 12px;
  text-anchor: middle;
}

.subtext {
  fill: #8b949e;
  font-size: 10px;
  text-anchor: middle;
}

.arrow {
  stroke: var(--stroke);
  stroke-width: 2;
  fill: none;
  stroke-dasharray: 6;
  animation: flow 2s linear infinite;
}

@keyframes flow {
  to { stroke-dashoffset: -12; }
}

.info {
  opacity: 0;
  transition: opacity 0.3s;
}

.group:hover .info {
  opacity: 1;
}

.info-text {
  font-size: 11px;
  fill: var(--text);
  text-anchor: middle;
}
</style>

<defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
    <polygon points="0 0, 6 3, 0 6" fill="#58a6ff"/>
  </marker>
</defs>

<rect class="background" width="1200" height="560"/>

<text x="600" y="30" class="text" font-size="18">
FPGA HEX to Video Pipeline Architecture
</text>

<!-- HEX INPUT -->
<g class="group">
  <rect class="box" x="40" y="240" width="150" height="70"/>
  <text x="115" y="275" class="text">HEX Input</text>
  <text x="115" y="290" class="subtext">16-bit Data</text>

  <g class="info">
    <text x="115" y="350" class="info-text">Raw data from FPGA</text>
    <text x="115" y="365" class="info-text">Each value = one pixel</text>
    <text x="115" y="380" class="info-text">Stored in HEX format</text>
  </g>
</g>

<!-- FRAME -->
<g class="group">
  <rect class="box" x="220" y="240" width="160" height="70"/>
  <text x="300" y="270" class="text">Frame Extraction</text>
  <text x="300" y="290" class="subtext">F00F F00F F00F F00F</text>

  <g class="info">
    <text x="300" y="350" class="info-text">Finds F00F pattern</text>
    <text x="300" y="365" class="info-text">Splits data into frames</text>
    <text x="300" y="380" class="info-text">Each frame = image</text>
  </g>
</g>

<!-- DECODE -->
<g class="group">
  <rect class="box" x="410" y="240" width="160" height="70"/>
  <text x="490" y="275" class="text">Pixel Decode</text>

  <g class="info">
    <text x="490" y="350" class="info-text">Convert HEX to number</text>
    <text x="490" y="365" class="info-text">Fix byte order if needed</text>
    <text x="490" y="380" class="info-text">Get pixel brightness</text>
  </g>
</g>

<!-- RECON -->
<g class="group">
  <rect class="box" x="600" y="240" width="160" height="70"/>
  <text x="680" y="275" class="text">Reconstruction</text>

  <g class="info">
    <text x="680" y="350" class="info-text">Arrange pixels in grid</text>
    <text x="680" y="365" class="info-text">Convert to grayscale</text>
    <text x="680" y="380" class="info-text">Ready for image output</text>
  </g>
</g>

<!-- SPLIT -->
<circle cx="790" cy="275" r="5" fill="#58a6ff"/>

<!-- NORMAL IMAGE -->
<g class="group">
  <rect class="box" x="820" y="140" width="150" height="60"/>
  <text x="895" y="165" class="text">Normal Image</text>
  <text x="895" y="180" class="subtext">PNG | 640×480</text>

  <g class="info">
    <text x="895" y="220" class="info-text">Direct grayscale image</text>
    <text x="895" y="235" class="info-text">Shows real brightness</text>
  </g>
</g>

<!-- NORMAL VIDEO -->
<g class="group">
  <rect class="box" x="990" y="140" width="150" height="60"/>
  <text x="1065" y="165" class="text">Video (MP4)</text>
  <text x="1065" y="180" class="subtext">FPS = N</text>

  <g class="info">
    <text x="1065" y="220" class="info-text">Frames → video</text>
    <text x="1065" y="235" class="info-text">Smooth playback</text>
  </g>
</g>

<!-- INVERTED IMAGE -->
<g class="group">
  <rect class="box" x="820" y="320" width="150" height="60"/>
  <text x="895" y="345" class="text">Inverted Image</text>
  <text x="895" y="360" class="subtext">PNG | Contrast</text>

  <g class="info">
    <text x="895" y="410" class="info-text">Pixel values inverted</text>
    <text x="895" y="425" class="info-text">Highlights details</text>
  </g>
</g>

<!-- INVERTED VIDEO -->
<g class="group">
  <rect class="box" x="990" y="320" width="150" height="60"/>
  <text x="1065" y="345" class="text">Video (MP4)</text>
  <text x="1065" y="360" class="subtext">FPS = N</text>

  <g class="info">
    <text x="1065" y="410" class="info-text">Video from inverted frames</text>
    <text x="1065" y="425" class="info-text">Better for debugging</text>
  </g>
</g>

<!-- ARROWS -->
<line class="arrow" x1="190" y1="275" x2="220" y2="275" marker-end="url(#arrowhead)"/>
<line class="arrow" x1="380" y1="275" x2="410" y2="275" marker-end="url(#arrowhead)"/>
<line class="arrow" x1="570" y1="275" x2="600" y2="275" marker-end="url(#arrowhead)"/>
<line class="arrow" x1="760" y1="275" x2="790" y2="275" marker-end="url(#arrowhead)"/>

<line class="arrow" x1="790" y1="275" x2="820" y2="170" marker-end="url(#arrowhead)"/>
<line class="arrow" x1="790" y1="275" x2="820" y2="350" marker-end="url(#arrowhead)"/>

<line class="arrow" x1="970" y1="170" x2="990" y2="170" marker-end="url(#arrowhead)"/>
<line class="arrow" x1="970" y1="350" x2="990" y2="350" marker-end="url(#arrowhead)"/>

</svg>

</div>

</body>
</html>
